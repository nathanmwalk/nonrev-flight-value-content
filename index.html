<!DOCTYPE html>
<html style="background-color: #10161c;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#10161c">
  <meta name="robots" content="noindex, nofollow">
  <title>Nonrev Flights</title>
  <style>
    html, body { 
      background-color: #10161c !important; 
      margin: 0; 
      padding: 0;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden; 
    }
    iframe { 
      border: 0; 
      width: 100vw; 
      height: 100vh;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: transparent;
      
      /* ONLY push the top down for the status bar. Let the bottom bleed through. */
      padding-top: env(safe-area-inset-top);
      padding-bottom: 0;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!-- Replace with your actual Google Apps Script Web App URL -->
  <iframe src="https://script.google.com/macros/s/AKfycbye7nPL93CdySNFZVho3YtVE5Pa-gSKuSj1HIXpQqoRcXwLbBNtGMyiAWFuJA0JSczYzQ/exec" allow="clipboard-write"></iframe>
</body>
</html>
