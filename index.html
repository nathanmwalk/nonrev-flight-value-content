<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#10161c">
  <meta name="robots" content="noindex, nofollow">
  <title>Nonrev Flights</title>
  <style>
    /* 1. Paint the absolute root of the browser dark to kill the white flash */
    html {
      background-color: #10161c;
      height: 100%;
    }
    
    /* 2. Pin the body to the 4 corners, bypassing dynamic viewport bugs entirely */
    body {
      margin: 0;
      padding: 0;
      position: fixed;
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0;
      background: linear-gradient(to bottom, #0f1318 50%, #10161c 50%);
      overflow: hidden;
    }
    
    /* 3. Have the iframe fill that pinned space */
    iframe {
      position: absolute;
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      
      /* Safe areas still applied perfectly to the inner content */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!-- Replace with your actual Google Apps Script Web App URL -->
  <iframe src="https://script.google.com/macros/s/AKfycbye7nPL93CdySNFZVho3YtVE5Pa-gSKuSj1HIXpQqoRcXwLbBNtGMyiAWFuJA0JSczYzQ/exec" allow="clipboard-write"></iframe>
</body>
</html>
