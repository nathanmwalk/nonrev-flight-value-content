  <style>
    html, body {

      overflow: hidden; 
    }

      border: 0; 
      width: 100%; 
      height: 100%; 
      display: block; 
      
      /* Apply safe areas to the iframe container, not the inner app */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
  </style>
</head>
